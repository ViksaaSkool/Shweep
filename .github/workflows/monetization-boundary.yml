name: Monetization Boundary

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monetization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify no monetization code, dependencies, config, or secrets in the app
        run: python3 tools/monetization_guard.py check-source
      - name: Verify monetization stays opt-in and disabled by default
        run: python3 tools/monetization_guard.py check-config
      - name: Guard self-test
        run: python3 tools/monetization_guard.py self-test

  dependency-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Dump app dependency graph
        run: |
          mkdir -p build/monetization-check
          ./gradlew :composeApp:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon > build/monetization-check/deps.txt
      - name: Verify dependency graph has no RevenueCat/Firebase
        run: python3 tools/monetization_guard.py check-dependencies-file build/monetization-check/deps.txt
