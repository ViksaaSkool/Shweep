name: Publish Android to Google Play (internal)

# Publishes a signed release AAB to the Google Play "internal" track.
#
# Authentication uses Google Workload Identity Federation, so no long-lived
# service-account JSON key is stored in GitHub.
#
# One-time manual setup is required before the first automated run; see
# PUBLISH_ANDROID.md (Play Console app, Play App Signing, upload keystore,
# service account, WIF pool/provider).
#
# Only app-related changes publish. Docs, art, Markdown and iOS-only changes are
# intentionally ignored so the website and documentation work never creates a
# Play release.

on:
  push:
    branches:
      - main
    paths:
      - "composeApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/publish-android.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Serialize uploads: overlapping Play edits would invalidate each other.
concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: google-play-internal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_PLAY_SERVICE_ACCOUNT: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}
          PLAY_VERSION_CODE_BASE: ${{ vars.PLAY_VERSION_CODE_BASE }}
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          ANDROID_VERSION_NAME_PREFIX: ${{ vars.ANDROID_VERSION_NAME_PREFIX }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_PLAY_SERVICE_ACCOUNT \
            PLAY_VERSION_CODE_BASE \
            ANDROID_PACKAGE_NAME \
            ANDROID_VERSION_NAME_PREFIX \
            ANDROID_UPLOAD_CERT_SHA256 \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_STORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required configuration: $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Configuration present."

      - name: Compute version
        id: version
        env:
          PLAY_VERSION_CODE_BASE: ${{ vars.PLAY_VERSION_CODE_BASE }}
          ANDROID_VERSION_NAME_PREFIX: ${{ vars.ANDROID_VERSION_NAME_PREFIX }}
        run: |
          set -euo pipefail
          if ! [[ "$PLAY_VERSION_CODE_BASE" =~ ^[0-9]+$ ]]; then
            echo "::error::PLAY_VERSION_CODE_BASE must be numeric (was '$PLAY_VERSION_CODE_BASE')"
            exit 1
          fi
          code=$(( PLAY_VERSION_CODE_BASE + GITHUB_RUN_NUMBER ))
          if [ "$code" -gt 2100000000 ]; then
            echo "::error::Computed versionCode $code exceeds the Google Play maximum of 2100000000"
            exit 1
          fi
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "version_name=${ANDROID_VERSION_NAME_PREFIX}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Publishing versionCode=$code versionName=${ANDROID_VERSION_NAME_PREFIX}.${GITHUB_RUN_NUMBER}"

      - name: Restore upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shweep-upload.jks"
          test -s "$RUNNER_TEMP/shweep-upload.jks"
          echo "Upload keystore restored."

      - name: Verify upload certificate
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          actual=$(keytool -list -v \
            -keystore "$RUNNER_TEMP/shweep-upload.jks" \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS" \
            -storepass "$ANDROID_UPLOAD_STORE_PASSWORD" \
            | awk -F': ' '/SHA256:/{print $2; exit}' \
            | tr -d ':' | tr 'A-Z' 'a-z')
          expected=$(printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ -z "$actual" ]; then
            echo "::error::Could not read the upload certificate from the keystore."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::Upload keystore certificate does not match ANDROID_UPLOAD_CERT_SHA256."
            echo "keystore: $actual"
            echo "expected: $expected"
            exit 1
          fi
          echo "Upload certificate verified."

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Build signed Android App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/shweep-upload.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :composeApp:bundleRelease \
            --no-daemon \
            -PandroidVersionCode="${{ steps.version.outputs.version_code }}" \
            -PandroidVersionName="${{ steps.version.outputs.version_name }}"

      - name: Verify bundle signature
        run: |
          set -euo pipefail
          aab=composeApp/build/outputs/bundle/release/composeApp-release.aab
          test -f "$aab" || { echo "::error::Release AAB not found at $aab"; exit 1; }
          jarsigner -verify "$aab"

      - name: Verify bundle contents
        run: |
          set -euo pipefail
          python3 tools/web_asset_guard.py check-archive \
            composeApp/build/outputs/bundle/release/composeApp-release.aab

      - name: Upload to Google Play internal track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJson: ${{ steps.google-auth.outputs.credentials_file_path }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: composeApp/build/outputs/bundle/release/composeApp-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ steps.version.outputs.version_name }}
