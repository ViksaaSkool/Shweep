name: Web Asset Boundary

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify no website or art assets in app build inputs
        run: python3 tools/web_asset_guard.py check-source
      - name: Verify Pages boundary
        run: python3 tools/web_asset_guard.py check-pages
      - name: Guard self-test
        run: python3 tools/web_asset_guard.py self-test

  android-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and release AAB
        run: ./gradlew :composeApp:assembleDebug :composeApp:bundleRelease --no-daemon
      - name: Verify artifacts contain no website assets
        run: |
          python3 tools/web_asset_guard.py check-archive \
            composeApp/build/outputs/apk/debug/composeApp-debug.apk \
            composeApp/build/outputs/bundle/release/composeApp-release.aab

  ios-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build simulator app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios-derived \
            build
      - name: Verify app bundle contains no website assets
        run: |
          APP="build/ios-derived/Build/Products/Release-iphonesimulator/Shweep.app"
          paths=("$APP")
          FW="$APP/Frameworks/ComposeApp.framework"
          if [ -d "$FW" ]; then
            paths+=("$FW")
          fi
          python3 tools/web_asset_guard.py check-archive "${paths[@]}"
